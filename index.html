<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>CypherLink — 1-on-1 Encrypted WebRTC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b0e14; color: #f3f4f6; }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- ==================== JOIN ROOM MODAL ==================== -->
  <div id="authOverlay" class="fixed inset-0 z-50 bg-[#0b0e14] flex items-center justify-center p-4">
    <div class="bg-[#111827] border border-gray-800 p-8 rounded-2xl max-w-md w-full shadow-2xl text-center">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 border border-indigo-500/30">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Join Secure 1-on-1 Room</h2>
      <p class="text-xs text-gray-400 mb-6">Enter your name and any shared room keyword. Both you and your friend just enter the same room name.</p>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Your Name</label>
          <input id="userNameInput" type="text" placeholder="e.g. Hanif" class="w-full bg-[#1e293b] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Shared Room Name / Password</label>
          <input id="roomNameInput" type="text" placeholder="e.g. secretroom77" class="w-full bg-[#1e293b] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 text-sm" />
        </div>
        <button onclick="enterRoom()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Connect to Room
        </button>
      </div>
      <p id="authStatus" class="mt-4 text-xs text-amber-400 font-mono hidden"></p>
    </div>
  </div>

  <!-- ==================== MESSENGER UI ==================== -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-72 bg-[#0f172a] border-r border-gray-800 flex flex-col">
      <div class="p-4 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white uppercase" id="myAvatar">?</div>
          <div class="overflow-hidden">
            <h3 class="text-sm font-semibold truncate text-white" id="myNameLabel">Disconnected</h3>
            <span class="text-[11px] text-emerald-400 flex items-center gap-1" id="networkStatus">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Standby
            </span>
          </div>
        </div>
      </div>
      <div class="p-3 text-[11px] font-bold tracking-wider text-gray-500 uppercase">Room Details</div>
      <div class="px-4 py-2 space-y-2 text-xs text-gray-400">
        <div>Room: <span id="roomLabel" class="text-white font-mono">None</span></div>
        <div>Role: <span id="roleLabel" class="text-indigo-400 font-semibold">None</span></div>
      </div>
    </aside>

    <!-- Main Chat Window -->
    <main class="flex-1 flex flex-col bg-[#0b0e14]">
      <!-- Chat Header -->
      <header class="h-16 border-b border-gray-800 px-6 flex items-center justify-between bg-[#0e131f]">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center font-bold uppercase" id="peerAvatar">?</div>
          <div>
            <h2 class="text-sm font-semibold text-white" id="peerName">Waiting for partner...</h2>
            <span id="connBadge" class="text-[10px] text-amber-400 font-mono">Searching room...</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="startCall(false)" title="Voice Call" class="w-10 h-10 rounded-xl bg-[#1e293b] hover:bg-emerald-600/20 hover:text-emerald-400 text-gray-300 flex items-center justify-center transition border border-gray-700/50">
            <i class="fa-solid fa-phone"></i>
          </button>
          <button onclick="startCall(true)" title="Video Call" class="w-10 h-10 rounded-xl bg-[#1e293b] hover:bg-indigo-600/20 hover:text-indigo-400 text-gray-300 flex items-center justify-center transition border border-gray-700/50">
            <i class="fa-solid fa-video"></i>
          </button>
        </div>
      </header>

      <!-- Messages Window -->
      <div id="messagesContainer" class="flex-1 overflow-y-auto p-6 space-y-4 chat-scroll">
        <div class="text-center my-4">
          <span class="text-[11px] bg-[#1e293b] text-gray-400 px-3 py-1 rounded-full border border-gray-800">
            <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> End-to-End TURN Tunnel Active.
          </span>
        </div>
      </div>

      <!-- Input Bar -->
      <div class="p-4 border-t border-gray-800 bg-[#0e131f]">
        <form onsubmit="sendMessage(event)" class="flex items-center gap-3">
          <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" class="flex-1 bg-[#1a2333] border border-gray-700 text-sm rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500" />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-medium text-sm transition flex items-center gap-2">
            <span>Send</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- ==================== CALL MODAL ==================== -->
  <div id="callOverlay" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex flex-col items-center justify-center p-6">
    <div class="relative w-full max-w-4xl h-[70vh] bg-gray-950 rounded-2xl overflow-hidden border border-gray-800 flex items-center justify-center">
      <video id="remoteVideo" autoplay playsinline webkit-playsinline class="w-full h-full object-cover"></video>
      <video id="localVideo" autoplay playsinline webkit-playsinline muted class="absolute bottom-4 right-4 w-32 h-24 md:w-48 md:h-36 object-cover rounded-xl border-2 border-indigo-500 bg-gray-900 shadow-xl"></video>
      <div id="audioIndicator" class="hidden absolute flex flex-col items-center justify-center gap-4 text-center">
        <div class="w-24 h-24 rounded-full bg-indigo-600/30 border border-indigo-500 text-indigo-400 text-4xl flex items-center justify-center animate-pulse">
          <i class="fa-solid fa-phone-volume"></i>
        </div>
        <p class="text-lg font-medium text-white">Voice Call Connected</p>
      </div>
    </div>
    <div class="flex items-center gap-4 mt-6">
      <button onclick="toggleMic()" id="micBtn" class="w-12 h-12 rounded-full bg-gray-800 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-microphone"></i>
      </button>
      <button onclick="toggleCam()" id="camBtn" class="w-12 h-12 rounded-full bg-gray-800 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-video"></i>
      </button>
      <button onclick="endCall()" class="w-12 h-12 rounded-full bg-rose-600 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-phone-slash"></i>
      </button>
    </div>
  </div>

  <!-- ==================== PEER & RELAY SCRIPT ==================== -->
  <script>
    let myName = "";
    let room = "";
    let peer = null;
    let activeConn = null;
    let activeCall = null;
    let localStream = null;
    let isMicMuted = false;
    let isCamDisabled = false;

    // Dedicated Metered TURN Servers
    const iceServersConfig = [
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "8d48358ef1172e5a21330cc9",
        credential: "3YwSHB1bbUMRfcnJ"
      },
      {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "8d48358ef1172e5a21330cc9",
        credential: "3YwSHB1bbUMRfcnJ"
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "8d48358ef1172e5a21330cc9",
        credential: "3YwSHB1bbUMRfcnJ"
      },
      {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "8d48358ef1172e5a21330cc9",
        credential: "3YwSHB1bbUMRfcnJ"
      }
    ];

    function sanitize(str) {
      return str.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function enterRoom() {
      myName = document.getElementById('userNameInput').value.trim();
      const rawRoom = document.getElementById('roomNameInput').value.trim();

      if (!myName || !rawRoom) {
        alert('Please fill out both your name and the shared room name.');
        return;
      }

      room = sanitize(rawRoom);
      document.getElementById('authStatus').textContent = 'Connecting to signaling network...';
      document.getElementById('authStatus').classList.remove('hidden');

      // First device tries to claim host: [room]-host
      tryHostRole();
    }

    function tryHostRole() {
      const hostId = room + '-host';
      peer = new Peer(hostId, {
        debug: 1,
        config: { iceServers: iceServersConfig, iceCandidatePoolSize: 10 }
      });

      peer.on('open', () => {
        setupInterface('Host (Waiting for partner)');
        // Listen for the second user joining
        peer.on('connection', (conn) => {
          setupConnection(conn);
        });
      });

      peer.on('error', (err) => {
        // If the host is already taken, this device is the Client/Guest
        if (err.type === 'unavailable-id') {
          peer.destroy();
          joinAsClient();
        } else {
          console.error(err);
        }
      });

      setupCallHandler();
    }

    function joinAsClient() {
      const clientId = room + '-guest-' + Math.floor(Math.random() * 1000);
      peer = new Peer(clientId, {
        debug: 1,
        config: { iceServers: iceServersConfig, iceCandidatePoolSize: 10 }
      });

      peer.on('open', () => {
        setupInterface('Guest (Connecting to Host...)');
        const hostId = room + '-host';
        const conn = peer.connect(hostId, {
          reliable: true,
          metadata: { name: myName }
        });
        setupConnection(conn);
      });

      peer.on('connection', (conn) => {
        setupConnection(conn);
      });

      setupCallHandler();
    }

    function setupInterface(roleText) {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('myNameLabel').textContent = myName;
      document.getElementById('myAvatar').textContent = myName[0].toUpperCase();
      document.getElementById('roomLabel').textContent = room;
      document.getElementById('roleLabel').textContent = roleText;
    }

    function setupConnection(conn) {
      activeConn = conn;

      conn.on('open', () => {
        // Exchange names
        conn.send({ type: 'HANDSHAKE', name: myName });
        document.getElementById('connBadge').textContent = 'WebRTC Relay Active';
        document.getElementById('connBadge').className = 'text-[10px] text-emerald-400 font-mono';
      });

      conn.on('data', (data) => {
        if (data.type === 'HANDSHAKE') {
          document.getElementById('peerName').textContent = data.name;
          document.getElementById('peerAvatar').textContent = data.name[0].toUpperCase();
          document.getElementById('connBadge').textContent = 'Connected • Direct Tunnel';
          document.getElementById('connBadge').className = 'text-[10px] text-emerald-400 font-mono';
        } else if (data.text) {
          appendMessage(data.text, 'incoming', data.time);
        }
      });

      conn.on('close', () => {
        document.getElementById('connBadge').textContent = 'Partner Disconnected';
        document.getElementById('connBadge').className = 'text-[10px] text-rose-500 font-mono';
        activeConn = null;
      });
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      if (!activeConn || !activeConn.open) {
        alert('Waiting for your partner to enter the same room name...');
        return;
      }

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      activeConn.send({ text, time });
      appendMessage(text, 'outgoing', time);
      input.value = '';
    }

    function appendMessage(text, direction, time) {
      const container = document.getElementById('messagesContainer');
      const isOut = direction === 'outgoing';

      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isOut ? 'items-end' : 'items-start'}`;
      msgDiv.innerHTML = `
        <div class="max-w-[75%] px-4 py-2.5 rounded-2xl text-sm ${
          isOut ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-[#1e293b] text-gray-200 rounded-bl-none border border-gray-700/60'
        } shadow">
          <p class="break-words">${text}</p>
          <div class="flex items-center justify-end gap-1 text-[10px] opacity-75 mt-1">
            <span>${time || 'Just now'}</span>
            ${isOut ? '<i class="fa-solid fa-check-double text-[9px]"></i>' : ''}
          </div>
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    // Call Handlers
    function setupCallHandler() {
      peer.on('call', async (call) => {
        const isVideo = call.metadata?.video !== false;
        if (confirm(`Incoming ${isVideo ? 'Video' : 'Voice'} call. Accept?`)) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
              video: isVideo ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
            });

            document.getElementById('callOverlay').classList.remove('hidden');
            document.getElementById('localVideo').srcObject = localStream;

            if (!isVideo) {
              document.getElementById('localVideo').classList.add('hidden');
              document.getElementById('remoteVideo').classList.add('hidden');
              document.getElementById('audioIndicator').classList.remove('hidden');
            } else {
              document.getElementById('localVideo').classList.remove('hidden');
              document.getElementById('remoteVideo').classList.remove('hidden');
              document.getElementById('audioIndicator').classList.add('hidden');
            }

            call.answer(localStream);
            handleStream(call);
          } catch (e) {
            alert('Media permission denied: ' + e.message);
            call.close();
          }
        } else {
          call.close();
        }
      });
    }

    async function startCall(isVideo) {
      if (!activeConn || !activeConn.peer) {
        alert('Partner not connected in room yet.');
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
          video: isVideo ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
        });

        document.getElementById('callOverlay').classList.remove('hidden');
        document.getElementById('localVideo').srcObject = localStream;

        if (!isVideo) {
          document.getElementById('localVideo').classList.add('hidden');
          document.getElementById('remoteVideo').classList.add('hidden');
          document.getElementById('audioIndicator').classList.remove('hidden');
        } else {
          document.getElementById('localVideo').classList.remove('hidden');
          document.getElementById('remoteVideo').classList.remove('hidden');
          document.getElementById('audioIndicator').classList.add('hidden');
        }

        const call = peer.call(activeConn.peer, localStream, { metadata: { video: isVideo } });
        handleStream(call);
      } catch (err) {
        alert('Media device access error: ' + err.message);
      }
    }

    function handleStream(call) {
      activeCall = call;
      call.on('stream', async (stream) => {
        const remoteVideo = document.getElementById('remoteVideo');
        remoteVideo.srcObject = stream;
        try { await remoteVideo.play(); } catch (err) {}
      });
      call.on('close', () => endCall());
    }

    function toggleMic() {
      if (!localStream) return;
      isMicMuted = !isMicMuted;
      localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
      document.getElementById('micBtn').classList.toggle('bg-rose-600', isMicMuted);
    }

    function toggleCam() {
      if (!localStream) return;
      isCamDisabled = !isCamDisabled;
      localStream.getVideoTracks().forEach(t => t.enabled = !isCamDisabled);
      document.getElementById('camBtn').classList.toggle('bg-rose-600', isCamDisabled);
    }

    function endCall() {
      if (activeCall) activeCall.close();
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      document.getElementById('callOverlay').classList.add('hidden');
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
    }
  </script>
</body>
</html>
