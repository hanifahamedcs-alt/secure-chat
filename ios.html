<!-- Remote Video (Full Screen) -->
<video 
  id="remoteVideo" 
  autoplay 
  playsinline 
  webkit-playsinline 
  class="w-full h-full object-cover">
</video>

<!-- Local Video (Picture-in-Picture) -->
<video 
  id="localVideo" 
  autoplay 
  playsinline 
  webkit-playsinline 
  muted 
  class="absolute bottom-4 right-4 w-32 h-24 md:w-48 md:h-36 object-cover rounded-xl border-2 border-indigo-500 bg-gray-900 shadow-xl">
</video>
